kind: Deployment
apiVersion: apps/v1
metadata:
  name: fixme
  labels:
    app: fixme
    app.kubernetes.io/component: fixme
    app.kubernetes.io/instance: fixme
    app.kubernetes.io/name: fixme
    app.kubernetes.io/part-of: fixme
    app.openshift.io/runtime: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fixme
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: fixme
        deployment: fixme
    spec:
      containers:
        - name: fixme
          image: quay.io/openshift-examples/otq-openshift/fixme-app:202511031025
          ports:
            - containerPort: 8080
              protocol: TCP
          resources: {}
          imagePullPolicy: Always
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
      imagePullSecrets: []
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
